version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - NOTION_CONTENT_DATABASE_ID=${NOTION_CONTENT_DATABASE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
